<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Переводчик</title>
    <link rel="icon" type="image/png" href="assets/app-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- Панель выбора языков -->
      <header class="lang-bar">
        <div class="lang-select-wrapper">
          <select id="source-lang" class="lang-select" aria-label="Исходный язык">
            <option value="ru" selected>Русский</option>
            <option value="uk">Українська</option>
            <option value="en">English</option>
          </select>
        </div>

        <button id="swap-btn" class="icon-btn swap-btn" title="Поменять языки местами">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>
          </svg>
        </button>

        <div class="lang-select-wrapper">
          <select id="target-lang" class="lang-select" aria-label="Язык перевода">
            <option value="ru">Русский</option>
            <option value="uk">Українська</option>
            <option value="en" selected>English</option>
          </select>
        </div>
      </header>

      <!-- Основная область с текстовыми полями -->
      <main class="translator-grid">
        <!-- Левая панель: Ввод -->
        <section class="panel input-panel">
          <textarea
            id="source-text"
            class="text-area"
            placeholder="Введите текст для перевода..."
            maxlength="5000"
            spellcheck="false"
          ></textarea>
          <div class="panel-footer">
            <span id="char-count" class="char-count">0 / 5000</span>
            <div class="actions">
              <button id="clear-btn" class="icon-btn" title="Очистить" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
              </button>
              <button id="translate-btn" class="primary-btn">Перевести</button>
            </div>
          </div>
        </section>

        <!-- Правая панель: Вывод -->
        <section class="panel output-panel">
          <textarea
            id="target-text"
            class="text-area"
            placeholder="Перевод появится здесь..."
            readonly
          ></textarea>
          <div class="panel-footer">
            <span id="status-text" class="status-text"></span>
            <div class="actions">
              <button id="copy-btn" class="icon-btn" title="Копировать перевод" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
